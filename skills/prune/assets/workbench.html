<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prune · 技能树与裁剪台</title>
<style>
:root{color-scheme:light;--paper:#F0F0E9;--ink:#242420;--line:#34342F;--muted:#6F7069;
  --ease:cubic-bezier(.22,1,.36,1);--nav-h:64px;--bar-h:64px;--banner-h:0px}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--paper);color:var(--ink);
  font:15px/1.7 "Noto Sans SC","Microsoft YaHei",system-ui,sans-serif}
code,pre,.mono{font-family:Consolas,"Courier New",monospace;font-size:14px}
button{font:inherit;cursor:pointer;border:1px solid var(--line);border-radius:0;
  background:transparent;color:var(--ink);padding:8px 16px;min-height:44px}
button.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
button:disabled{opacity:.4;cursor:not-allowed}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
/* 骨架布局:64px 导航 / 主区 / 64px 待应用栏,具体组件样式由后续任务追加 */
#app-nav{height:var(--nav-h);display:flex;align-items:stretch;border-bottom:1px solid var(--line)}
#app-nav .brand{padding:0 24px;display:flex;align-items:center;font-size:18px;border-right:1px solid var(--line)}
#app-nav nav{display:flex}
#app-nav nav button{border:0;border-right:1px solid var(--line);padding:0 32px;font-size:16px}
#app-nav nav button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
#connBadge{margin-left:auto;display:flex;align-items:center;gap:8px;padding:0 24px;
  border-left:1px solid var(--line);color:var(--muted);font-size:13px}
#connBadge.off{color:var(--ink)}
#view{position:fixed;top:var(--nav-h);bottom:calc(var(--bar-h) + env(safe-area-inset-bottom));left:0;right:0;overflow:auto}
#pendingBar{position:fixed;left:0;right:0;bottom:0;height:calc(var(--bar-h) + env(safe-area-inset-bottom));
  border-top:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:0 24px;
  padding-bottom:env(safe-area-inset-bottom);background:var(--paper)}
#pendingBar .spacer{flex:1}
#pendingSummary{line-height:1.4;flex-shrink:0}
.chip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);padding:4px 12px;font-size:13px}
#toast{position:fixed;top:calc(var(--nav-h) + var(--banner-h) + 12px);left:50%;transform:translateX(-50%);
  z-index:30;max-width:min(640px,calc(100vw - 32px));background:var(--paper);border:1px solid var(--line);
  padding:12px 20px;font-size:14px;box-shadow:none;display:flex;align-items:flex-start;gap:12px}
#toast[hidden]{display:none}
#toast.error{border-style:double}
#toastClose{border:0;min-height:0;padding:0 2px;font-size:16px;line-height:1.5;flex:0 0 auto}
#loading{position:fixed;inset:var(--nav-h) 0 0 0;z-index:40;background:var(--paper);display:grid;
  place-content:center;text-align:center;gap:16px}
#loading[hidden]{display:none}
#loading .wordmark{font-size:28px;letter-spacing:.3em}
body.reduced *{transition-duration:.08s!important;animation:none!important}
/* Task 3: 技能树视图 */
.tree-view{display:flex;flex-direction:column;height:100%;overflow:hidden}
.tree-toolbar{height:56px;flex:0 0 56px;display:flex;align-items:center;gap:12px;
  padding:0 16px;border-bottom:1px solid var(--line);font-size:14px;overflow:hidden}
.tree-toolbar .crumb{font-size:15px;white-space:nowrap}
.tree-toolbar input[type=search]{font:inherit;height:36px;padding:0 10px;width:200px;
  border:1px solid var(--line);border-radius:0;background:var(--paper);color:var(--ink)}
.tree-toolbar select{font:inherit;height:36px;border:1px solid var(--line);border-radius:0;
  background:var(--paper);color:var(--ink)}
.tree-toolbar .spacer{flex:1}
.tree-toolbar .count{color:var(--muted);font-size:13px;white-space:nowrap}
.tree-toolbar button{min-height:36px;padding:4px 12px;font-size:13px}
.tree-toolbar button.linklike{border:0;text-decoration:underline}
.plan-notice{font-size:13px;line-height:1.6;color:var(--muted);overflow-wrap:anywhere}
.tree-view>.plan-notice{margin:0;padding:10px 24px;border-bottom:1px solid var(--line)}
.tree-stage{position:relative;flex:1;overflow:hidden}
.tree-stage>svg{display:block;width:100%;height:100%;cursor:grab;touch-action:none}
.tree-stage>svg.panning{cursor:grabbing}
.t-trunk{fill:none;stroke:var(--ink);stroke-width:9;stroke-linecap:round}
.t-rootlet{fill:none;stroke:var(--ink);stroke-width:3;stroke-linecap:round}
.t-conn{fill:none;stroke:var(--line);stroke-width:2.5}
.tnode,.t-conn,.t-glabel{transition:opacity .18s var(--ease)}
.tnode{cursor:pointer;transform-box:fill-box;transform-origin:center}
.tnode circle.body{fill:var(--paper);stroke:var(--ink);stroke-width:2.5;
  transform-box:fill-box;transform-origin:center;
  transition:transform .18s var(--ease),fill .18s var(--ease)}
.tnode circle.hot{fill:transparent;pointer-events:all} /* 透明热区 r≥34,置于节点最上层 */
.tnode.adv-undetermined circle.body{stroke-dasharray:5 4}
.tnode.more circle.body{stroke:var(--muted);stroke-dasharray:4 4}
.tnode text{fill:var(--ink);font-size:15px;pointer-events:none}
.tnode text.sub{fill:var(--muted);font-size:12.5px}
.tnode.more text{fill:var(--muted);font-size:12px}
.tnode.grp text{font-size:14px}
.tnode.grp text.sub{font-size:11.5px}
.tnode .ico{fill:none;stroke:var(--ink);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.tnode .ico text{fill:var(--ink);stroke:none;font-size:15px}
.tnode .ring{fill:none;stroke:var(--ink);stroke-width:2;opacity:0;transform-box:fill-box;
  transform-origin:center;transition:opacity .18s var(--ease),transform .18s var(--ease)}
.tnode:hover .ring,.tnode:focus-visible .ring{opacity:.6} /* hover 环反馈 */
.tnode.sel .ring{opacity:1}
.tnode.sel circle.body{fill:var(--ink);transform:scale(1.05)}
.tnode.sel .ico{stroke:var(--paper)}
.tnode.sel .ico text{fill:var(--paper)}
.tnode:active circle.body{transform:scale(.94)}
.tnode:focus{outline:none}
.tnode:focus-visible .ring{transform:scale(1.08)}
.tnode.dim{opacity:.22}
.tnode.hit circle.body{transform:scale(1.1)}
.tnode .badge{opacity:0;transform-box:fill-box;transform-origin:center;transition:opacity .18s var(--ease)}
.tnode.approved .badge{opacity:1} /* 已采纳:墨线环 + 对勾标 */
.tnode.approved .ring{opacity:.9}
.tnode.adopt-flash .badge{animation:badgePop .18s var(--ease)}
.tnode.adopt-flash .ring{animation:ringIn .18s var(--ease)}
@keyframes badgePop{from{opacity:0;transform:scale(.4)}}
@keyframes ringIn{from{opacity:0;transform:scale(.7)}}
.t-glabel text{fill:var(--ink);font-size:14px;pointer-events:none}
.t-glabel text.sub{fill:var(--muted);font-size:12px}
.soft{opacity:.35}
/* 入场:仅首次,播完由 JS 移除 .enter;枝干 pathLength=1 描绘生长,叶按分组错峰 30ms pop,总时长 ≤800ms */
.enter path.t-grow{stroke-dasharray:1;stroke-dashoffset:1;animation:tGrow .5s var(--ease) forwards}
.enter g.t-grow,.enter text.t-grow{opacity:0;animation:tIn .42s var(--ease) forwards}
.enter .t-stub{opacity:0;animation:tIn .42s var(--ease) forwards}
.enter .t-leaf{opacity:0;transform:scale(.3);animation:tPop .46s var(--ease) forwards}
@keyframes tGrow{to{stroke-dashoffset:0}}
@keyframes tIn{to{opacity:1}}
@keyframes tPop{to{opacity:1;transform:scale(1)}}
/* 修剪动效:停用断枝飘落 780ms 留虚线残枝;修改 400ms 缩放回弹再生;恢复 300ms 接回/回实 */
.t-fall{transform-box:fill-box;transform-origin:center;pointer-events:none;
  animation:leafFall .78s var(--ease) forwards}
@keyframes leafFall{to{transform:translateY(60px) rotate(9deg);opacity:0}}
.t-stub{stroke-dasharray:5 5}
.tnode.pruned .stub-mark{fill:var(--paper);stroke:var(--muted);stroke-width:2;stroke-dasharray:4 3}
.tnode.pruned .stub-cut{stroke:var(--muted);stroke-width:2;stroke-linecap:round}
.tnode.pruned .stub-name{fill:var(--muted);font-size:13px}
.tnode.pruned:hover .stub-mark,.tnode.pruned:focus-visible .stub-mark{stroke:var(--ink)}
.tnode.pruned:hover .stub-name,.tnode.pruned:focus-visible .stub-name{fill:var(--ink)}
.tnode.pruned.sel .stub-mark{stroke:var(--ink);stroke-width:2.5}
.tnode.applied-mod circle.body{stroke-dasharray:6 4} /* 修改已应用:虚环 */
.tnode.regen circle.body{animation:regenPop .4s var(--ease)}
@keyframes regenPop{0%{opacity:0;transform:scale(.5)}70%{transform:scale(1.07)}100%{opacity:1;transform:scale(1)}}
.t-regrow{stroke-dasharray:1;stroke-dashoffset:1;animation:tGrow .3s var(--ease) forwards}
.tnode.restore-pop{animation:tPop .3s var(--ease)}
.tree-legend{position:absolute;left:16px;bottom:12px;display:flex;gap:16px;align-items:center;
  font-size:13px;color:var(--muted);background:var(--paper);padding:4px 10px;border:1px solid var(--line)}
.tree-legend svg{vertical-align:-4px;margin-right:6px;fill:none;stroke:var(--ink);
  stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.tree-legend svg text{fill:var(--ink);stroke:none;font-size:15px}
.tree-zoom{position:absolute;right:16px;bottom:12px;display:flex;gap:6px;align-items:center}
.tree-zoom button{min-height:36px;min-width:40px;padding:4px 10px;font-size:13px;background:var(--paper)}
.tree-zoom .pct{min-width:58px}
.tree-zoom button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
#inspector{position:absolute;top:0;right:0;bottom:0;width:320px;background:var(--paper);
  border-left:1px solid var(--line);padding:20px;overflow:auto;
  transform:translateX(16px);opacity:0;pointer-events:none;
  transition:transform .28s var(--ease),opacity .28s var(--ease)}
#inspector.open{transform:none;opacity:1;pointer-events:auto}
#inspector h2{margin:0 36px 8px 0;font-size:20px;line-height:1.3;word-break:break-all}
#inspector .ins-close{position:absolute;top:10px;right:10px;border:0;min-height:36px;padding:2px 10px;font-size:16px}
#inspector .ins-rows{margin:14px 0;border-top:1px solid var(--line)}
#inspector .ins-row{display:flex;justify-content:space-between;gap:12px;padding:8px 0;
  border-bottom:1px solid var(--line);font-size:14px}
#inspector .ins-row>span:first-child{color:var(--muted);white-space:nowrap}
#inspector .ins-sum{font-size:14px;margin:0 0 12px}
#inspector .ins-outcome{font-size:13px;color:var(--muted);margin:0 0 12px}
#inspector .ins-pills{display:flex;gap:8px;flex-wrap:wrap;margin:2px 0 0}
#inspector .ins-sec{display:flex;gap:10px;margin:0 0 14px}
#inspector .ins-sec>svg{flex:0 0 18px;margin-top:2px;fill:none;stroke:var(--ink);
  stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
#inspector .ins-sec h3{margin:0 0 2px;font-size:13px;color:var(--muted);font-weight:normal}
#inspector .ins-sec p{margin:0;font-size:14px;word-break:break-all}
#inspector .ins-diff{width:100%;margin-top:4px}
#inspector .ins-actions{display:flex;gap:10px;margin-top:16px}
#inspector .ins-actions button{flex:1;padding:8px 6px}
/* Task 4: 裁剪台 · 对象目录与总览 */
.muted{color:var(--muted)}
.cut-view{display:flex;height:100%;overflow:hidden}
.cut-catalog{width:220px;flex:0 0 220px;border-right:1px solid var(--line);
  display:flex;flex-direction:column;min-height:0}
.cut-catalog h2{margin:0;padding:14px 16px 8px;font-size:15px}
.cat-search{padding:0 12px 10px;border-bottom:1px solid var(--line)}
.cat-search input{width:100%;font:inherit;height:36px;padding:0 10px;
  border:1px solid var(--line);border-radius:0;background:var(--paper);color:var(--ink)}
.cat-groups{flex:1;overflow:auto;padding:6px 0 12px;min-height:0}
.cat-head{display:flex;align-items:center;gap:6px;width:100%;border:0;min-height:38px;
  padding:6px 14px;font-size:14px;text-align:left}
.cat-head .arrow{width:12px;color:var(--muted)}
.cat-head .n{margin-left:auto;font-size:12px;color:var(--muted)}
.cat-list{display:grid}
.cat-item{display:block;width:100%;border:0;text-align:left;min-height:0;
  padding:5px 14px 5px 32px;font-size:14px;word-break:break-all}
.cat-item .src{display:block;font-size:12px;color:var(--muted)}
.cat-item[aria-current="true"]{box-shadow:inset 3px 0 0 var(--ink)}
.cat-empty{padding:12px 16px;font-size:13px}
.cut-main{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
.cut-head{padding:18px 24px 12px}
.cut-head h1{margin:0;font-size:26px;line-height:1.3}
.cut-head p{margin:4px 0 0;font-size:14px}
.cut-head .adv-counts{color:var(--muted)}
.cut-toolbar{position:relative;flex:0 0 56px;display:flex;align-items:center;gap:12px;
  padding:0 24px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.cut-toolbar input[type=search]{font:inherit;height:36px;padding:0 10px;width:min(300px,50%);
  border:1px solid var(--line);border-radius:0;background:var(--paper);color:var(--ink)}
.cut-toolbar .spacer{flex:1}
.cut-toolbar button{min-height:36px;padding:4px 14px;font-size:14px}
.cut-filter-wrap{position:relative}
.cut-filter-pop{position:absolute;top:calc(100% + 8px);right:0;z-index:25;width:260px;
  display:grid;gap:10px;background:var(--paper);border:1px solid var(--line);padding:14px}
.cut-filter-pop label{display:grid;gap:4px;font-size:13px;color:var(--muted)}
.cut-filter-pop select{font:inherit;height:34px;border:1px solid var(--line);border-radius:0;
  background:var(--paper);color:var(--ink)}
/* 对象总览:卡片网格(图04);桌面 ≥1200px 两列,以下单列;首载 120ms 交叉淡入 */
.cut-list{flex:1;overflow:auto;padding:16px 24px;min-height:0;
  display:grid;grid-template-columns:1fr;gap:14px;align-content:start}
@media (min-width:1200px){.cut-list{grid-template-columns:1fr 1fr}}
.cut-row{display:flex;align-items:stretch;border:1px solid var(--line);background:var(--paper)}
.cut-row:hover{border-color:var(--ink)}
.cut-row[aria-current="true"]{box-shadow:inset 3px 0 0 var(--ink)}
.cut-ico{flex:0 0 auto;display:grid;place-content:center;padding:14px 4px 14px 18px}
.cut-info{flex:1;min-width:0;padding:14px 18px}
.cut-name{font-size:18px;display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.cut-name .chip{font-size:12px;padding:2px 8px}
.cut-facts{display:grid;gap:2px;margin:8px 0 0;font-size:13px}
.cut-fact{display:flex;gap:6px}
.cut-fact dt{color:var(--muted)}
.cut-fact dd{margin:0}
.cut-open-cell{flex:0 0 auto;display:flex;align-items:center;border-left:1px solid var(--line);padding:0 20px}
.cut-open{flex:0 0 auto;white-space:nowrap}
.cut-empty{flex:1;display:grid;place-content:center;justify-items:center;gap:12px;
  text-align:center;padding:24px}
.cut-empty strong{font-size:20px}
.cut-empty p{margin:0;color:var(--muted)}
.cut-foot{flex:0 0 auto;padding:8px 24px;font-size:13px;color:var(--muted);
  border-top:1px solid var(--line)}
/* Task 5: 裁剪台 · 对象详情(建议/文件差异/依据与验证) */
.detail-head{padding:14px 24px 0}
.detail-head .back{border:0;text-decoration:underline;padding:0;min-height:0;font-size:14px}
.detail-head h1{margin:6px 0 2px;font-size:26px;line-height:1.3;word-break:break-all}
.detail-paths{margin:2px 0 0;font-size:12.5px;color:var(--muted);word-break:break-all}
.detail-pills{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 0}
.detail-outcome{margin:6px 0 0;font-size:13px;color:var(--muted)}
.detail-sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  border:1px solid var(--line);margin:14px 24px 0}
.detail-sum>section{padding:10px 14px;min-width:0}
.detail-sum>section+section{border-left:1px solid var(--line)}
.detail-sum h3{margin:0 0 4px;font-size:13px;color:var(--muted);font-weight:normal}
.detail-sum p,.detail-sum ul{margin:0;font-size:14px}
.detail-sum ul{padding-left:18px}
.detail-tabs{flex:0 0 auto;display:flex;border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);margin-top:14px}
.detail-tabs [role=tab]{border:0;border-right:1px solid var(--line);min-height:44px;
  padding:8px 28px;font-size:15px;background:transparent}
.detail-tabs [role=tab][aria-selected="true"]{background:var(--ink);color:var(--paper)}
.detail-body{flex:1;min-height:0;overflow:auto;padding:18px 24px 28px}
.detail-body.diffs{overflow:hidden;padding:0;display:flex}
.fade-in{animation:dIn .14s var(--ease)}
@keyframes dIn{from{opacity:0}}
.detail-actions{flex:0 0 var(--bar-h);display:flex;align-items:center;justify-content:flex-end;
  gap:12px;padding:0 24px;border-top:1px solid var(--line)}
.detail-actions .hint{margin-right:auto;font-size:13px;color:var(--muted)}
.note-box{border:1px solid var(--line);padding:12px 16px;font-size:14px;margin:0 0 14px}
.note-box h3{margin:0 0 4px;font-size:14px}
.ev-quote{border-left:3px solid var(--ink);padding:6px 14px;margin:0 0 6px;font-size:15px}
.ev-src{font-size:12.5px;color:var(--muted);margin:0 0 14px}
.ev-sec{margin:0 0 18px}
.ev-sec h3,.ev-sec summary{margin:0 0 8px;font-size:14px}
.ev-sec summary{cursor:pointer}
.ev-row{display:flex;justify-content:space-between;gap:16px;padding:8px 0;
  border-bottom:1px solid var(--line);font-size:14px}
.ev-row .st{white-space:nowrap}
/* 文件差异:目录 + 双栏 */
.diff-layout{flex:1;display:flex;min-height:0;min-width:0;border-top:0}
.diff-files{width:200px;flex:0 0 200px;border-right:1px solid var(--line);overflow:auto;min-height:0}
.diff-files h3{margin:0;padding:12px 12px 6px;font-size:13px;color:var(--muted);font-weight:normal}
.diff-group-head{padding:8px 12px 2px;font-size:12px;color:var(--muted);
  word-break:break-all;border-top:1px solid var(--line)}
.file-btn{display:block;width:100%;border:0;text-align:left;padding:8px 12px;
  font-size:13px;word-break:break-all;min-height:0}
.file-btn[aria-current="true"]{box-shadow:inset 3px 0 0 var(--ink)}
.file-btn .st{display:block;font-size:12px;color:var(--muted)}
.diff-main{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden}
.diff-trunc{flex:0 0 auto;border-bottom:1px solid var(--line);padding:6px 12px;font-size:13px}
.diff-cols{flex:1;display:grid;grid-template-columns:1fr 1fr;min-height:0}
.diff-pane{overflow:auto;min-width:0;min-height:0}
.diff-pane+.diff-pane{border-left:1px solid var(--line)}
.diff-pane .ph{position:sticky;top:0;z-index:1;display:flex;justify-content:space-between;gap:12px;
  padding:8px 12px;border-bottom:1px solid var(--line);font-size:13px;background:var(--paper)}
.diff-pane .ph .muted{word-break:break-all}
.dl{display:flex;font-family:Consolas,"Courier New",monospace;font-size:14px;
  line-height:1.6;white-space:pre}
.dl .no{flex:0 0 auto;width:44px;text-align:right;padding-right:10px;
  color:var(--muted);user-select:none}
.dl .mk{flex:0 0 auto;width:18px;user-select:none}
.dl.del{color:var(--muted)}
button.dl.fold{border:0;width:100%;min-height:0;padding:0;text-align:left;
  color:var(--muted);font-family:Consolas,"Courier New",monospace;font-size:13px}
button.dl.fold .tx{text-decoration:underline}
.diff-empty{display:grid;place-content:center;height:100%;color:var(--muted);
  font-size:13px;padding:24px;text-align:center}
.diff-void{flex:1;display:grid;place-content:center;color:var(--muted);font-size:14px;
  padding:24px;text-align:center}
.bin-scroll{flex:1;overflow:auto;padding:16px 24px;min-height:0}
.bin-cols{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);margin:0 0 12px}
.bin-card{padding:12px 16px;min-width:0}
.bin-card+.bin-card{border-left:1px solid var(--line)}
.bin-card h3{margin:0 0 8px;font-size:14px}
.bin-rows{margin:0;display:grid;gap:6px;font-size:13px}
.bin-rows>div{display:flex;gap:10px}
.bin-rows dt{color:var(--muted);flex:0 0 64px}
.bin-rows dd{margin:0;word-break:break-all}
/* Task 6: 待应用清单覆盖层与应用流程 */
#pendingLayer{position:fixed;top:var(--nav-h);left:0;right:0;bottom:0;z-index:20;background:var(--paper);

function lcsOps(a,b){ // 中段行级对齐;过大时退化为整段增删,避免 O(n·m) 爆炸
  const n=a.length,m=b.length;
  if(n*m>400000)return[...a.map(l=>({t:'-',l})),...b.map(l=>({t:'+',l}))];
  const dp=new Uint32Array((n+1)*(m+1));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)
    dp[i*(m+1)+j]=a[i]===b[j]?dp[(i+1)*(m+1)+j+1]+1:Math.max(dp[(i+1)*(m+1)+j],dp[i*(m+1)+j+1]);
  const ops=[];let i=0,j=0;
  while(i<n&&j<m){
    if(a[i]===b[j]){ops.push({t:'=',l:a[i]});i++;j++}
    else if(dp[(i+1)*(m+1)+j]>=dp[i*(m+1)+j+1]){ops.push({t:'-',l:a[i]});i++}
    else{ops.push({t:'+',l:b[j]});j++}}

    sfx:a.slice(a.length-s),p,s,total:a.length,bTotal:b.length}}

function pushRun(lines,startNo,rows,file,it,slot){ // 公共前后缀:>8 行折叠为可展开行(按文件记忆)
  const LIMIT=8,EDGE=3,key=it.id+'/'+file.path+':'+slot,open=S.folds.has(key);
  if(lines.length>LIMIT&&!open){
    lines.slice(0,EDGE).forEach((l,k)=>rows.push(lineRow(startNo+k,l,'')));
    rows.push(foldRow('··· 公共内容 '+(lines.length-EDGE*2)+' 行,点击展开 ···',key));
    lines.slice(-EDGE).forEach((l,k)=>rows.push(lineRow(startNo+lines.length-EDGE+k,l,'')));
  }else{
    lines.forEach((l,k)=>rows.push(lineRow(startNo+k,l,'')));
    if(lines.length>LIMIT&&open)rows.push(foldRow('··· 点击收起 ···',key))}}
function diffRows(d,file,side,it){
  const rows=[];
  pushRun(d.pfx,1,rows,file,it,'pre');
  let ln=d.p+1,rn=d.p+1;
  for(const op of d.ops){
    if(side==='before'){
      if(op.t==='='){rows.push(lineRow(ln++,op.l,''));rn++}
      else if(op.t==='-')rows.push(lineRow(ln++,op.l,'del'));
    }else{
      if(op.t==='='){rows.push(lineRow(rn++,op.l,''));ln++}
      else if(op.t==='+')rows.push(lineRow(rn++,op.l,'add'))}}
  pushRun(d.sfx,(side==='before'?d.total:d.bTotal)-d.sfx.length+1,rows,file,it,'post');
  return rows}

    h('div',{class:'sc-cols'},
      h('section',{class:'sc-panel','aria-label':'画像'},
        h('h2',null,'画像'),
        row('当前模型与宿主',p.model||'(方案未注明)',p.host?'宿主:'+p.host:''),
        row('当前任务',(p.tasks||[]).join('、')||'(方案未注明)'),
        row('使用偏好',(p.preferences||[]).join('、')||'(方案未注明)'),
        row('方案准备日期',fmtDate(plan.createdAt))),
      h('section',{class:'sc-panel','aria-label':'对象范围'},
        h('h2',null,'对象范围'),
        h('p',{class:'sc-big'},`${items.length} 对象 = ${skills} 技能 + ${plugins} 完整插件${items.some(i=>i.kind==='instruction')?' + '+items.filter(i=>i.kind==='instruction').length+' 规则':''}`),
        row('用户独立与项目技能','纳入评审','由用户安装的独立技能及项目技能。'),
        items.some(i=>i.kind==='instruction')?row('提示词与规则','单独审阅','可记录采纳或暂缓；不作为技能包写入。'):null,
        row('完整插件','整包评审','以插件为单位进行整体评审,包含其所有组件。'),
        row('平台固定背景','不计入候选','随平台提供的内置能力与运行基础,不纳入本次评审。'),
        h('p',{class:'sc-note'},'插件组件归为一个对象；缓存版本不等于已安装。'))),
    h('section',{class:'sc-panel','aria-label':'来源目录'},
      h('h2',null,'来源目录与覆盖说明'),
      row('发现目录',(plan.discoveryRoots||[]).length
        ?h('ul',{class:'sc-list mono'},plan.discoveryRoots.map(r=>h('li',null,String(r.path))))
        :'(方案未声明)'),
      row('各项来源汇总',`用户来源 ${cnt('user')} · 项目来源 ${cnt('project')} · 完整插件 ${cnt('plugin')} · 平台固定 ${cnt('platform')+cnt('system')} · 来源未知 ${cnt('unknown')}`),
      row('覆盖说明',(plan.coverage||[]).length
        ?h('ul',{class:'sc-list'},plan.coverage.map(c=>h('li',null,String(c))))
        :'(方案未记录)')),
    h('section',{class:'sc-panel','aria-label':'评审与执行说明'},
      h('h2',null,'评审与执行说明'),
      h('div',{class:'sc-legend'},

          h('ul',null,
            lg('●','保留','建议保留,当前任务仍需要。'),
            lg('◐','修改','建议调整后继续使用。'),
            lg('✕','停用','建议不再使用。'),
            lg('?','无法判定','当前信息不足以判断,需补充信息(未评审 / 待补信息)。'))),
        h('div',null,h('h3',null,'决定(用户的采纳意向)'),
          h('ul',null,
            lg('○','未决定','尚未做出采纳决定。'),
            lg('☑','已采纳','同意该评审结论。'),
            lg('−','暂不采纳','不同意该评审结论。'))),
        h('div',null,h('h3',null,'执行方式(若涉及变更时的处理方式)'),
          h('ul',null,
            lg('⚙︎','工作台执行','由本工具在工作台中执行变更。'),

            lg('◌','尚无执行方案','暂无明确的执行方案。'))))),
    h('footer',{class:'sc-foot'},
      h('span',null,'方案准备 ',h('span',{class:'mono'},fmtDate(plan.createdAt))),
      h('span',null,'只读指纹 ',h('span',{class:'mono'},shortHash(plan.fingerprint)),
        ' ',h('button',{id:'scopeCopyFp',onclick:copyFp},'复制')),
      h('span',{class:'spacer'}),
      h('button',{onclick:back},'← 返回')))}
$('pendingOpenBtn').onclick=openPendingList;
$('applyButton').onclick=applySelected;
$('toastClose').onclick=hideToast;
$('motionToggleBtn').onclick=motionToggle;
reducedMedia.onchange=e=>{ // 没有显式选择时跟随系统；手动开关在页面刷新后保持。
  if(!['reduced','full'].includes(localStorage.getItem('prune-motion'))){S.reduced=e.matches;applyMotionPref()}};
mqMobile.onchange=()=>{if(S.data)render()}; // 跨越移动断点时重建视图(树分组折叠/详情目录/文件下拉)
applyMotionPref(); // M-2 挂载点:启动时按 localStorage['prune-motion'] 挂 reduced 类
refresh();setInterval(refresh,1100);
</script>
